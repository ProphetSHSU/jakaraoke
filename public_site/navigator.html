<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Navigator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg-card: #14141f;
      --bg-strip: #0e0e16;
      --accent: #4ecca3;
      --accent-dim: #2a7a5a;
      --warning: #ffd93d;
      --danger: #e94560;
      --text: #ffffff;
      --text-mid: #a8a8c0;
      --text-dim: #5a5a72;
      --ready-green: #4ecca3;
      --ready-pending: #3a3a50;
      --font: 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
      --nav-font-scale: 1.0;
    }

    html, body {
      height: 100%; width: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* === TOP BAR === */
    .top-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 10px;
      background: var(--bg-strip);
      border-bottom: 1px solid #1e1e2e;
      min-height: 44px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--danger);
      transition: background 0.2s;
    }
    .status-dot.connected { background: var(--accent); }
    .player-name {
      font-size: 13px; font-weight: 600;
      color: var(--text-mid);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .setlist-label {
      flex: 1; text-align: right;
      font-size: 12px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* === SONG STACK (prev / now / next) === */
    .song-stack {
      display: none;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      padding: 20px 16px;
      gap: 12px;
      min-height: 0;
    }

    .song-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      transition: background 0.15s, transform 0.15s;
    }
    .song-row.prev, .song-row.next {
      background: var(--bg-card);
      opacity: 0.7;
    }
    .song-row.current {
      background: linear-gradient(135deg, #1a2a2a 0%, #14141f 100%);
      border: 2px solid var(--accent);
      opacity: 1;
      transform: scale(1.02);
    }
    .song-row.divider .song-name {
      color: var(--warning);
      font-style: italic;
    }

    .song-glyph {
      flex: 0 0 auto;
      font-size: calc(18px * var(--nav-font-scale));
      color: var(--text-dim);
      width: 28px; text-align: center;
    }
    .song-row.current .song-glyph { color: var(--accent); font-size: calc(22px * var(--nav-font-scale)); }

    .song-name {
      flex: 1;
      font-size: clamp(calc(18px * var(--nav-font-scale)), calc(5vw * var(--nav-font-scale)), calc(32px * var(--nav-font-scale)));
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-mid);
    }
    .song-row.current .song-name {
      color: var(--text);
      font-size: clamp(calc(24px * var(--nav-font-scale)), calc(7vw * var(--nav-font-scale)), calc(44px * var(--nav-font-scale)));
      font-weight: 800;
    }

    .song-meta {
      flex: 0 0 auto;
      font-size: calc(12px * var(--nav-font-scale));
      color: var(--text-dim);
      text-align: right;
    }

    /* === TRANSPORT + CONTROLS === */
    .controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-strip);
      border-top: 1px solid #1e1e2e;
    }

    
    /* === METRONOME === */
    .metronome {
      display: flex; gap: 5px; align-items: center;
    }
    .metro-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #2a2a3a;
      transition: background 0.08s;
    }
    .metro-dot.lit { background: var(--accent, #e94560); }

    /* === SETTINGS === */
    .settings-btn {
      width: 30px; height: 30px;
      border-radius: 6px; border: 1px solid #2a2a3a;
      background: #14141f; color: var(--text-dim, #6a6a85);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      touch-action: manipulation;
    }
    .settings-btn:active { background: #2a2a3a; }
    .settings-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 100;
      background: rgba(0,0,0,0.7);
    }
    .settings-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }
    .settings-card {
      background: #14141f;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 20px;
      width: 90%; max-width: 340px;
      color: var(--text, #fff);
    }
    .settings-card h2 {
      margin: 0 0 16px; font-size: 18px; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between;
    }
    .settings-card .close-btn {
      background: none; border: none; color: var(--text-dim, #6a6a85); font-size: 22px; cursor: pointer;
    }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid #1a1a2e;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 14px; color: var(--text-dim, #a8a8c0); }
    .setting-control { display: flex; align-items: center; gap: 8px; }
    .setting-control input[type="text"],
    .setting-control select {
      background: #0a0a12; border: 1px solid #2a2a3a; border-radius: 6px;
      color: var(--text, #fff); padding: 6px 10px; font-size: 14px; width: 140px;
    }
    .setting-control select { appearance: none; -webkit-appearance: none; cursor: pointer; }
    .toggle-track {
      width: 44px; height: 24px; border-radius: 12px;
      background: #2a2a3a; position: relative; cursor: pointer; transition: background 0.2s;
    }
    .toggle-track.on { background: var(--accent, #e94560); }
    .toggle-knob {
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; position: absolute; top: 2px; left: 2px; transition: left 0.2s;
    }
    .toggle-track.on .toggle-knob { left: 22px; }
    
    /* === SET PROGRESS === */
    .set-progress {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 16px;
      font-size: 15px; font-weight: 600; color: #e0e0f0;
      background: var(--bg-strip, #0a0a12);
      border-top: 1px solid #1a1a2e;
    }
    .set-progress .bar {
      flex: 1; max-width: 200px; height: 6px;
      background: #1a1a2e; border-radius: 3px; overflow: hidden;
    }
    .set-progress .fill {
      height: 100%; background: var(--accent, #e94560);
      border-radius: 2px; transition: width 0.5s;
    }
    
    /* === TRACK TOGGLES === */
    .track-toggles {
      display: flex; gap: 8px; padding: 6px 16px;
      justify-content: center;
      background: var(--bg-strip, #0a0a12);
      border-top: 1px solid #1a1a2e;
    }
    .track-btn {
      flex: 1; max-width: 160px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #2a2a3a;
      background: #14141f;
      color: var(--text-dim, #6a6a85);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      touch-action: manipulation;
    }
    .track-btn.active {
      /* On — track is unmuted in Ableton */
      border-color: #4ecca3;
      background: rgba(78, 204, 163, 0.15);
      color: #4ecca3;
    }
    .track-btn.off {
      /* Off — track is muted in Ableton */
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.15);
      color: #e94560;
    }
    .track-btn:active { transform: scale(0.95); }
    .track-btn.lights { border-color: #ffd93d; color: #ffd93d; }
    .track-btn.lights.open { background: rgba(255, 217, 61, 0.15); }

    /* === LIGHTING DRAWER === */
    .lighting-drawer {
      display: none;
      padding: 10px 16px 12px;
      background: var(--bg-strip, #0a0a12);
      border-top: 1px solid #1a1a2e;
      gap: 10px;
      flex-direction: column;
    }
    .lighting-drawer.open { display: flex; }
    .lighting-drawer .blackout-btn {
      width: 100%; padding: 12px;
      border-radius: 8px; border: 2px solid #e94560;
      background: rgba(233, 69, 96, 0.15);
      color: #e94560; font-size: 15px; font-weight: 800;
      cursor: pointer; text-align: center;
      text-transform: uppercase; letter-spacing: 0.1em;
      touch-action: manipulation;
      transition: all 0.15s;
    }
    .lighting-drawer .blackout-btn:active {
      background: #e94560; color: #fff; transform: scale(0.97);
    }
    .lighting-drawer .ambient-row {
      display: flex; gap: 8px; align-items: center;
    }
    .lighting-drawer .ambient-row select {
      flex: 1; padding: 8px 10px;
      border-radius: 8px; border: 1px solid #2a2a3a;
      background: #14141f; color: var(--text);
      font-size: 14px; font-weight: 500;
      appearance: none; -webkit-appearance: none;
      cursor: pointer;
    }
    .lighting-drawer .ambient-row button {
      padding: 8px 16px; border-radius: 8px;
      border: 2px solid #2a2a3a; background: #14141f;
      color: var(--text-mid); font-size: 13px; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      transition: all 0.15s;
    }
    .lighting-drawer .ambient-row button:active { transform: scale(0.95); }
    .lighting-drawer .ambient-row .go-btn {
      border-color: #4ecca3; color: #4ecca3;
    }
    .lighting-drawer .ambient-row .go-btn:active {
      background: #4ecca3; color: var(--bg);
    }
    .lighting-drawer .ambient-row .off-btn {
      border-color: #e94560; color: #e94560;
    }
    .lighting-drawer .dim-row {
      display: flex; gap: 6px; align-items: center;
    }
    .lighting-drawer .dim-row .dim-label {
      font-size: 12px; color: var(--text-dim); font-weight: 600;
      margin-right: 4px; text-transform: uppercase;
    }
    .lighting-drawer .dim-row button {
      flex: 1; padding: 7px 0;
      border-radius: 6px; border: 1px solid #2a2a3a;
      background: #14141f; color: var(--text-mid);
      font-size: 12px; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      transition: all 0.15s;
    }
    .lighting-drawer .dim-row button:active { transform: scale(0.95); }
    .lighting-drawer .dim-row button.active {
      border-color: #ffd93d; background: rgba(255, 217, 61, 0.15); color: #ffd93d;
    }
    .ctrl-btn {
      touch-action: manipulation;
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid var(--text-dim);
      background: transparent;
      color: var(--text-mid);
      font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active { transform: scale(0.92); }
    .ctrl-btn.play {
      width: 80px; height: 80px;
      border-color: var(--accent);
      color: var(--accent);
      font-size: 32px;
    }
    .ctrl-btn.play.playing {
      background: var(--accent);
      color: var(--bg);
    }
    .ctrl-btn.stop { border-color: var(--danger); color: var(--danger); }

    /* === READY CHECK === */
    .ready-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-card);
      border-top: 1px solid #1e1e2e;
    }
    .ready-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 2px solid var(--ready-pending);
      background: transparent;
      color: var(--text-mid);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .ready-btn.is-ready {
      border-color: var(--ready-green);
      background: var(--ready-green);
      color: var(--bg);
    }
    .ready-players {
      flex: 1;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .player-pip {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; color: var(--text-dim);
    }
    .player-pip .pip-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ready-pending);
      transition: background 0.2s;
    }
    .player-pip.ready .pip-dot { background: var(--ready-green); }
    .player-pip.ready { color: var(--text-mid); }

    /* === REGISTRATION MODAL === */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid #2e2e3e;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 320px; width: 90%;
    }
    .modal-box h2 { margin-bottom: 16px; font-size: 20px; }
    .modal-box input {
      width: 100%; padding: 12px 16px;
      border-radius: 8px; border: 1px solid #3e3e4e;
      background: var(--bg); color: var(--text);
      font-size: 18px; text-align: center;
      outline: none;
    }
    .modal-box input:focus { border-color: var(--accent); }
    .modal-box button {
      margin-top: 16px; padding: 12px 32px;
      border-radius: 8px; border: none;
      background: var(--accent); color: var(--bg);
      font-size: 16px; font-weight: 600;
      cursor: pointer;
    }

    /* === DISCONNECTED === */
    .disconnected-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: var(--danger);
      color: white; text-align: center;
      padding: 6px; font-size: 13px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      transform: translateY(-100%);
      transition: transform 0.2s;
      z-index: 500;
    }
    .disconnected-banner.show { transform: translateY(0); }

    /* === FULL SETLIST (scrollable) === */
    .setlist-panel {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 4px 12px;
      border-top: 1px solid #1e1e2e;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    .setlist-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 15px;
      color: var(--text-mid);
      cursor: pointer;
      transition: background 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .setlist-item:active { background: #1e1e2e; }
    .setlist-item.active {
      background: linear-gradient(135deg, #1a2a2a 0%, #14141f 100%);
      border: 1px solid var(--accent);
      color: var(--text);
      font-weight: 600;
    }
    .setlist-item.divider {
      color: var(--warning);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: default;
      padding: 8px 12px;
      opacity: 0.8;
    }
    .setlist-item.unmatched {
      color: var(--danger);
      font-style: italic;
    }
  
    .health-banner {
      display: none;
      background: #3d2000;
      border: 1px solid var(--warning, #f5a623);
      border-radius: 6px;
      padding: 8px 12px;
      margin: 8px 16px 0;
      font-size: 13px;
      color: #f5a623;
    }
    .health-banner.visible { display: block; }
    .health-banner summary { cursor: pointer; font-weight: 600; }
    .health-banner ul { margin: 4px 0 0 16px; padding: 0; }
    .health-banner li { margin: 2px 0; }
  </style>
</head>
<body>

  <div class="disconnected-banner" id="disconnectedBanner">⚠ Reconnecting…</div>

  <!-- Registration modal -->
  <div class="modal-overlay hidden" id="registerModal">
    <div class="modal-box">
      <h2>Who are you?</h2>
      <input type="text" id="nameInput" placeholder="Your name" autocomplete="off" />
      <button id="nameSubmit">Join</button>
    </div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="player-name" id="playerName">—</div>
    <div class="setlist-label" id="setlistLabel">—</div>
    <div style="flex:1;"></div>
    <div class="metronome" id="metronome">
      <div class="metro-dot" id="metroDot0"></div>
      <div class="metro-dot" id="metroDot1"></div>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
  </div>

  <!-- Song stack -->
  <div class="song-stack" id="songStack">
    <div class="song-row prev" id="prevRow">
      <div class="song-glyph">◀</div>
      <div class="song-name" id="prevName">—</div>
    </div>
    <div class="song-row current" id="currentRow">
      <div class="song-glyph">▶</div>
      <div class="song-name" id="currentName">—</div>
      <div class="song-meta" id="currentMeta"></div>
    </div>
    <div class="song-row next" id="nextRow">
      <div class="song-glyph">▶▶</div>
      <div class="song-name" id="nextName">—</div>
    </div>
  </div>


  <!-- Full setlist (scrollable, tap to jump) -->
  <div class="health-banner" id="healthBanner"><details><summary id="healthSummary"></summary><ul id="healthList"></ul></details></div>
    <div class="setlist-panel" id="setlistPanel"></div>

  <!-- Transport controls -->
  <div class="controls">
    <button class="ctrl-btn" id="btnPrev" title="Previous">⏮</button>
    <button class="ctrl-btn stop" id="btnStop" title="Stop">■</button>
    <button class="ctrl-btn play" id="btnPlay" title="Play">▶</button>
    <button class="ctrl-btn" id="btnNext" title="Next">⏭</button>
  </div>

  <!-- Track toggles -->
  <div class="track-toggles">
    <button class="track-btn" id="trackOriginal" data-track="Original">🎧 Original</button>
    <button class="track-btn" id="trackBT" data-track="BT">🔊 Backing</button>
    <button class="track-btn lights" id="btnLights">💡</button>
  </div>

  <!-- Lighting drawer -->
  <div class="lighting-drawer" id="lightingDrawer">
    <button class="blackout-btn" id="btnBlackout">⬛ Blackout</button>
    <div class="ambient-row">
      <select id="ambientSelect">
        <option value="Fire">Fire</option>
        <option value="Ocean">Ocean</option>
        <option value="Neon">Neon</option>
        <option value="Jungle">Jungle</option>
        <option value="Twilight">Twilight</option>
        <option value="Sunset">Sunset</option>
        <option value="Arctic">Arctic</option>
        <option value="Toxic">Toxic</option>
        <option value="Gold">Gold</option>
        <option value="Smoke">Smoke</option>
        <option value="Spring">Spring</option>
        <option value="Blood">Blood</option>
        <option value="Vapor">Vapor</option>
        <option value="Storm">Storm</option>
      </select>
      <button class="go-btn" id="btnAmbientGo">▶ GO</button>
      <button class="off-btn" id="btnAmbientOff">■ OFF</button>
    </div>
    <div class="dim-row">
      <span class="dim-label">Dim</span>
      <button data-dim="25">Sil</button>
      <button data-dim="50">50</button>
      <button data-dim="75">75</button>
      <button data-dim="100">Full</button>
    </div>
  </div>

  <!-- Set progress -->
  <div class="set-progress" id="setProgress">
    <div style="display:flex;align-items:center;gap:8px;width:100%;justify-content:center;">
      <span id="setProgressText"></span>
      <div class="bar"><div class="fill" id="setProgressFill"></div></div>
      <span id="setProgressTime"></span>
    </div>
    <div id="setRemaining" style="font-size:13px;color:#4ecca3;font-weight:500;"></div>
  </div>

  <!-- Ready check -->
  <div class="ready-bar">
    <button class="ready-btn" id="readyBtn">Ready</button>
    <div class="ready-players" id="readyPlayers"></div>
  </div>


  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-card">
      <h2>Settings <button class="close-btn" id="settingsClose">&times;</button></h2>
      <div class="setting-row">
        <span class="setting-label">Display Name</span>
        <div class="setting-control">
          <input type="text" id="settingName" placeholder="Your name" />
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Metronome</span>
        <div class="setting-control">
          <div class="toggle-track" id="settingMetronome"><div class="toggle-knob"></div></div>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Font Size</span>
        <div class="setting-control">
          <select id="settingFontScale">
            <option value="0.85">Small</option>
            <option value="1.0">Normal</option>
            <option value="1.15">Large</option>
            <option value="1.3">XL</option>
          </select>
        </div>
      </div>

    </div>
  </div>

<script>
// ===========================================================================
// Navigator — glanceable setlist view with transport controls + ready check
// ===========================================================================
// Connects to jakaraoke WebSocket server. Displays prev/current/next song.
// Sends commands (play, stop, next, prev) and ready-check messages.
// ===========================================================================

// ---------- Config ----------
var WS_URL = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') +
             '//' + (window.location.host || 'localhost:9898') + '/';

// ---------- State ----------
var playerName = localStorage.getItem('navigator_player_name') || '';
var isReady = false;
var serverState = null;       // last state message
var transportState = 'stopped';
var currentSongMeta = null;

// ---------- DOM ----------
var el = {
  statusDot: document.getElementById('statusDot'),
  disconnectedBanner: document.getElementById('disconnectedBanner'),
  registerModal: document.getElementById('registerModal'),
  nameInput: document.getElementById('nameInput'),
  nameSubmit: document.getElementById('nameSubmit'),
  playerName: document.getElementById('playerName'),
  setlistLabel: document.getElementById('setlistLabel'),
  prevRow: document.getElementById('prevRow'),
  prevName: document.getElementById('prevName'),
  currentRow: document.getElementById('currentRow'),
  currentName: document.getElementById('currentName'),
  currentMeta: document.getElementById('currentMeta'),
  nextRow: document.getElementById('nextRow'),
  nextName: document.getElementById('nextName'),
  btnPrev: document.getElementById('btnPrev'),
  btnStop: document.getElementById('btnStop'),
  btnPlay: document.getElementById('btnPlay'),
  btnNext: document.getElementById('btnNext'),
  readyBtn: document.getElementById('readyBtn'),
  readyPlayers: document.getElementById('readyPlayers')
};

// ---------- Registration ----------
function checkRegistration() {
  if (!playerName) {
    el.registerModal.classList.remove('hidden');
    el.nameInput.focus();
  } else {
    el.registerModal.classList.add('hidden');
    el.playerName.textContent = playerName;
  }
}

el.nameSubmit.addEventListener('click', submitName);
el.nameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitName(); });

function submitName() {
  var name = el.nameInput.value.trim();
  if (!name) return;
  playerName = name;
  localStorage.setItem('navigator_player_name', name);
  el.registerModal.classList.add('hidden');
  el.playerName.textContent = name;
  sendRegister();
}

checkRegistration();

// ---------- WebSocket ----------
// Wake Lock (prevent screen dimming)
(function() {
  var wakeLock = null;
  function requestWakeLock() {
    if ("wakeLock" in navigator) {
      navigator.wakeLock.request("screen").then(function(lock) {
        wakeLock = lock;
        wakeLock.addEventListener("release", function() { wakeLock = null; });
      }).catch(function() {});
    }
  }
  requestWakeLock();
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") requestWakeLock();
  });
})();

var ws;


// ---------- Visual Metronome ----------
var metronomeState = { intervalId: null, tick: 0, tempo: 0 };

function startMetronome(bpm) {
  stopMetronome();
  if (!bpm || bpm <= 0) return;
  if (!navPrefs.showMetronome) return;
  metronomeState.tempo = bpm;
  metronomeState.tick = 0;
  updateMetronomeDots();
  metronomeState.intervalId = setInterval(function() {
    metronomeState.tick = 1 - metronomeState.tick;
    updateMetronomeDots();
  }, 60000 / bpm);
}

function stopMetronome() {
  if (metronomeState.intervalId) { clearInterval(metronomeState.intervalId); metronomeState.intervalId = null; }
  metronomeState.tick = 0;
  var d0 = document.getElementById('metroDot0');
  var d1 = document.getElementById('metroDot1');
  if (d0) d0.classList.remove('lit');
  if (d1) d1.classList.remove('lit');
}

function updateMetronomeDots() {
  var d0 = document.getElementById('metroDot0');
  var d1 = document.getElementById('metroDot1');
  if (d0) d0.classList.toggle('lit', metronomeState.tick === 0);
  if (d1) d1.classList.toggle('lit', metronomeState.tick === 1);
}

// ---------- Navigator Preferences ----------
var navPrefs = {
  showMetronome: localStorage.getItem('nav_show_metronome') !== 'false',
  fontScale:     parseFloat(localStorage.getItem('nav_font_scale')) || 1.0,
};

function applyNavPrefs() {
  document.getElementById('metronome').style.display = navPrefs.showMetronome ? 'flex' : 'none';
  document.documentElement.style.setProperty('--nav-font-scale', String(navPrefs.fontScale));
}
applyNavPrefs();

// ---------- Settings panel ----------
(function() {
  var overlay = document.getElementById('settingsOverlay');
  var btnOpen = document.getElementById('settingsBtn');
  var btnClose = document.getElementById('settingsClose');
  var nameInput = document.getElementById('settingName');
  var metroToggle = document.getElementById('settingMetronome');
  var fontScaleSelect = document.getElementById('settingFontScale');

  function openSettings() {
    nameInput.value = playerName || '';
    metroToggle.classList.toggle('on', navPrefs.showMetronome);
    fontScaleSelect.value = String(navPrefs.fontScale);
    overlay.classList.add('open');
  }

  function closeSettings() {
    var newName = nameInput.value.trim();
    if (newName && newName !== playerName) {
      playerName = newName;
      localStorage.setItem('navigator_player_name', playerName);
      el.playerName.textContent = playerName;
      sendRegister();
    }
    overlay.classList.remove('open');
  }

  btnOpen.addEventListener('click', openSettings);
  btnClose.addEventListener('click', closeSettings);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeSettings(); });

  metroToggle.addEventListener('click', function() {
    navPrefs.showMetronome = !navPrefs.showMetronome;
    metroToggle.classList.toggle('on', navPrefs.showMetronome);
    localStorage.setItem('nav_show_metronome', String(navPrefs.showMetronome));
    applyNavPrefs();
    if (!navPrefs.showMetronome) stopMetronome();
    else if (currentSongMeta && currentSongMeta.tempo) startMetronome(currentSongMeta.tempo);
  });

  fontScaleSelect.addEventListener('change', function() {
    var val = parseFloat(fontScaleSelect.value);
    if (!val || val < 0.5 || val > 2.0) val = 1.0;
    navPrefs.fontScale = val;
    localStorage.setItem('nav_font_scale', String(val));
    applyNavPrefs();
  });

})();


// ---------- Set Progress ----------
function fmtDuration(secs) {
  if (!secs || secs <= 0) return '0:00';
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = Math.floor(secs % 60);
  if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function renderSetProgress(state) {
  var el = document.getElementById('setProgress');
  if (!el || !state || !state.songDurations) { if (el) el.style.display = 'none'; return; }

  var durations = state.songDurations || [];
  var setList = state.setList || [];
  var total = state.totalSetSeconds || 0;
  var pointer = state.songPointer || 0;

  // Count songs, compute elapsed, find current set boundaries
  var songCount = 0; var currentSongNum = 0;
  var elapsed = 0;
  var currentSetStart = 0; // index of first song in current set
  var currentSetEnd = setList.length; // index after last song in current set

  // Find set boundaries around pointer
  for (var i = pointer; i >= 0; i--) {
    if (typeof setList[i] === 'object' && setList[i].type === 'divider') { currentSetStart = i + 1; break; }
  }
  for (var i = pointer + 1; i < setList.length; i++) {
    if (typeof setList[i] === 'object' && setList[i].type === 'divider') { currentSetEnd = i; break; }
  }

  // Compute set remaining (from current song to end of current set)
  var setRemaining = 0;
  for (var i = pointer; i < currentSetEnd; i++) {
    setRemaining += durations[i] || 0;
  }

  // Compute total remaining (from current song to end)
  var totalRemaining = 0;
  for (var i = pointer; i < durations.length; i++) {
    totalRemaining += durations[i] || 0;
  }

  // Count songs and elapsed
  for (var i = 0; i < durations.length; i++) {
    var isDivider = typeof setList[i] === 'object';
    if (!isDivider) songCount++;
    if (i < pointer) elapsed += durations[i];
    if (i === pointer && !isDivider) currentSongNum = songCount;
  }

  if (total <= 0 || songCount === 0) { el.style.display = 'none'; return; }
  el.style.display = 'flex';

  var pct = Math.min(100, Math.round((elapsed / total) * 100));
  document.getElementById('setProgressText').textContent = 'Song ' + currentSongNum + ' of ' + songCount;
  document.getElementById('setProgressFill').style.width = pct + '%';
  document.getElementById('setProgressTime').textContent = fmtDuration(elapsed) + ' / ' + fmtDuration(total);
  document.getElementById('setRemaining').textContent = fmtDuration(setRemaining) + ' left in set \u00b7 ' + fmtDuration(totalRemaining) + ' left total';
}

function renderHealthBanner(unmatched) {
  var banner = document.getElementById("healthBanner");
  var summary = document.getElementById("healthSummary");
  var list = document.getElementById("healthList");
  if (!banner || !unmatched) { if (banner) banner.classList.remove("visible"); return; }
  if (unmatched.length === 0) { banner.classList.remove("visible"); return; }
  banner.classList.add("visible");
  summary.textContent = "\u26a0\ufe0f " + unmatched.length + " scene" + (unmatched.length > 1 ? "s" : "") + " without lyrics";
  list.innerHTML = unmatched.map(function(s) { return "<li>" + s + "</li>"; }).join("");
}



// ---------- Track toggles ----------
var trackState = { "Original": null, "BT": null };

function renderTrackButtons() {
  // Green when on (active), red when off, neutral grey when state is unknown (null).
  var btnOrig = document.getElementById('trackOriginal');
  var btnBT = document.getElementById('trackBT');
  if (btnOrig) {
    btnOrig.classList.toggle('active', trackState["Original"] === true);
    btnOrig.classList.toggle('off',    trackState["Original"] === false);
  }
  if (btnBT) {
    btnBT.classList.toggle('active', trackState["BT"] === true);
    btnBT.classList.toggle('off',    trackState["BT"] === false);
  }
}

document.getElementById('trackOriginal').addEventListener('click', function() {
  sendCommand('toggle_track', { track: 'Original' });
});
document.getElementById('trackBT').addEventListener('click', function() {
  sendCommand('toggle_track', { track: 'BT' });
});

// ---------- Lighting drawer ----------
(function() {
  var btnLights = document.getElementById('btnLights');
  var drawer = document.getElementById('lightingDrawer');
  var longPressTimer = null;
  var longPressFired = false;

  function sendLighting(action, extra) {
    var msg = { type: 'lighting', action: action };
    if (extra) for (var k in extra) msg[k] = extra[k];
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  }

  // Long-press = blackout, short-tap = toggle drawer
  btnLights.addEventListener('touchstart', function(e) {
    e.preventDefault();
    longPressFired = false;
    longPressTimer = setTimeout(function() {
      longPressFired = true;
      sendLighting('blackout');
      btnLights.style.background = 'rgba(233,69,96,0.4)';
      setTimeout(function() { btnLights.style.background = ''; }, 300);
    }, 500);
  });
  btnLights.addEventListener('touchend', function() {
    clearTimeout(longPressTimer);
    if (!longPressFired) {
      drawer.classList.toggle('open');
      btnLights.classList.toggle('open');
    }
  });
  btnLights.addEventListener('touchcancel', function() { clearTimeout(longPressTimer); });
  // Mouse fallback (desktop testing)
  btnLights.addEventListener('click', function(e) {
    if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
    drawer.classList.toggle('open');
    btnLights.classList.toggle('open');
  });

  // Blackout button
  document.getElementById('btnBlackout').addEventListener('click', function() {
    sendLighting('blackout');
  });

  // Ambient GO
  document.getElementById('btnAmbientGo').addEventListener('click', function() {
    var palette = document.getElementById('ambientSelect').value;
    sendLighting('ambient', { palette: palette });
  });

  // Ambient OFF
  document.getElementById('btnAmbientOff').addEventListener('click', function() {
    sendLighting('ambientOff');
  });

  // Dim buttons
  var dimBtns = document.querySelectorAll('.dim-row button[data-dim]');
  for (var i = 0; i < dimBtns.length; i++) {
    dimBtns[i].addEventListener('click', function() {
      var level = parseInt(this.getAttribute('data-dim'));
      sendLighting('dim', { level: level });
      // Highlight active
      for (var j = 0; j < dimBtns.length; j++) dimBtns[j].classList.remove('active');
      this.classList.add('active');
    });
  }
})();

// ---------- Keyboard shortcuts ----------
document.addEventListener('keydown', function(e) {
  // Ignore if typing in an input field
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

  switch (e.key) {
    case 'ArrowRight':
      e.preventDefault();
      sendCommand('next');
      break;
    case 'ArrowLeft':
      e.preventDefault();
      sendCommand('prev');
      break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      sendCommand(transportState === 'playing' ? 'stop' : 'play');
      break;
  }
});

function connectWebSocket() {
  ws = new WebSocket(WS_URL);

  ws.onopen = function() {
    el.statusDot.classList.add('connected');
    el.disconnectedBanner.classList.remove('show');
    sendRegister();
  };

  ws.onclose = function() {
    el.statusDot.classList.remove('connected');
    el.disconnectedBanner.classList.add('show');
    setTimeout(connectWebSocket, 2000);
  };

  ws.onerror = function() {};

  ws.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);

      if (msg.type === 'state') {
        serverState = msg;
        renderSetProgress(msg);
        renderHealthBanner(msg.unmatchedScenes);
        _hookUpdateDisplay(msg);
        renderSongStack();
        resetReady(); // song changed
        return;
      }

      if (msg.type === 'tracks') {
        if (msg.tracks) {
          for (var tk in msg.tracks) trackState[tk] = msg.tracks[tk];
          renderTrackButtons();
        }
        return;
      }
      if (msg.type === 'transport') {
        transportState = msg.state || 'stopped';
        if (transportState === 'playing' && msg.tempo && msg.tempo > 0 && currentSongMeta) {
          startMetronome(msg.tempo);
        } else if (transportState === 'stopped') {
          stopMetronome();
        }
        renderPlayButton();
        return;
      }

      if (msg.command === 0 && msg.song) {
        currentSongMeta = msg.song.metadata || {};
        if (currentSongMeta.tempo) startMetronome(currentSongMeta.tempo);
        else stopMetronome();
        renderCurrentMeta();
        return;
      }

      if (msg.command === 0 && msg.setBreak === true) {
        currentSongMeta = null;
        stopMetronome();
        renderSongStack();
        return;
      }

      // Ready-state broadcast (future server feature)
      if (msg.type === 'readyState') {
        renderReadyPlayers(msg.players || []);
        return;
      }

    } catch(err) {
      console.error('WS parse error:', err);
    }
  };
}
connectWebSocket();

// ---------- Send helpers ----------
function wsSend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function sendRegister() {
  if (playerName) wsSend({ type: 'register', name: playerName });
}

function sendCommand(action, extra) {
  var msg = { type: 'command', action: action }; if (extra) { for (var k in extra) msg[k] = extra[k]; } wsSend(msg);
}

// ---------- Controls ----------
el.btnPlay.addEventListener('click', function() { sendCommand(transportState === 'playing' ? 'stop' : 'play'); });
el.btnStop.addEventListener('click', function() { sendCommand('stop'); });
el.btnNext.addEventListener('click', function() { sendCommand('next'); });
el.btnPrev.addEventListener('click', function() { sendCommand('prev'); });

el.readyBtn.addEventListener('click', function() {
  isReady = !isReady;
  el.readyBtn.classList.toggle('is-ready', isReady);
  el.readyBtn.textContent = isReady ? '✓ Ready' : 'Ready';
  wsSend({ type: 'ready', ready: isReady });
});

function resetReady() {
  isReady = false;
  el.readyBtn.classList.remove('is-ready');
  el.readyBtn.textContent = 'Ready';
}

// ---------- Rendering ----------
function renderSongStack() {
  if (!serverState) return;

  var list = serverState.setList || [];
  var sp = serverState.songPointer;

  // Setlist label
  var label = serverState.activeSetlist || 'All Songs';
  if (serverState.activeLibrary) label = serverState.activeLibrary + ' — ' + label;
  el.setlistLabel.textContent = label;

  // Previous
  var prev = findAdjacentItem(list, sp, -1);
  renderRow(el.prevRow, el.prevName, prev, 'prev');

  // Current
  var current = (sp >= 0 && sp < list.length) ? list[sp] : null;
  renderCurrentRow(current);

  // Next
  var next = findAdjacentItem(list, sp, +1);
  renderRow(el.nextRow, el.nextName, next, 'next');
}

function findAdjacentItem(list, sp, direction) {
  var i = sp + direction;
  while (i >= 0 && i < list.length) {
    var item = list[i];
    if (typeof item === 'string') return { kind: 'song', value: item };
    if (typeof item === 'object' && item.type === 'divider') return { kind: 'divider', setNumber: item.setNumber };
    i += direction;
  }
  return null; // start or end
}

function renderRow(rowEl, nameEl, item, position) {
  rowEl.classList.remove('divider');
  if (!item) {
    nameEl.textContent = position === 'prev' ? '— START —' : '— END —';
    rowEl.classList.remove('divider');
  } else if (item.kind === 'divider') {
    nameEl.textContent = '— Set ' + (item.setNumber || '') + ' —';
    rowEl.classList.add('divider');
  } else {
    nameEl.textContent = prettify(item.value);
  }
}

function renderCurrentRow(current) {
  el.currentRow.classList.remove('divider');
  if (!current) {
    el.currentName.textContent = '—';
  } else if (typeof current === 'object' && current.type === 'divider') {
    el.currentName.textContent = '— Set ' + (current.setNumber || '') + ' —';
    el.currentRow.classList.add('divider');
  } else {
    el.currentName.textContent = prettify(current);
  }
  renderCurrentMeta();
}

function renderCurrentMeta() {
  if (!currentSongMeta) { el.currentMeta.textContent = ''; return; }
  var parts = [];
  if (currentSongMeta.key) parts.push(currentSongMeta.key);
  if (currentSongMeta.tempo) parts.push(currentSongMeta.tempo + ' BPM');
  if (currentSongMeta.capo) parts.push('Capo ' + currentSongMeta.capo);
  el.currentMeta.textContent = parts.join(' · ');
}

function renderPlayButton() {
  el.btnPlay.classList.toggle('playing', transportState === 'playing');
  el.btnPlay.textContent = transportState === 'playing' ? '⏸' : '▶';
}

function renderReadyPlayers(players) {
  el.readyPlayers.innerHTML = '';
  players.forEach(function(p) {
    if (p.name === playerName) return; // don't show self
    var pip = document.createElement('div');
    pip.className = 'player-pip' + (p.ready ? ' ready' : '');
    pip.innerHTML = '<span class="pip-dot"></span><span>' + esc(p.name) + '</span>';
    el.readyPlayers.appendChild(pip);
  });
}

// ---------- Utilities ----------
function prettify(name) {
  if (!name) return '—';
  return String(name).replace(/\.txt$/i, '').replace(/_/g, ' ');
}

function esc(v) {
  return String(v).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// Keep screen awake
if ('wakeLock' in navigator) {
  (async function() { try { await navigator.wakeLock.request('screen'); } catch(e) {} })();
}

// Double-tap fullscreen
document.body.addEventListener('dblclick', function() {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
});


// ---------- Setlist panel (full list, tap to jump) ----------
var fullSetlist = []; // populated from server state messages
var currentSceneIndex = -1;

function renderSetlistPanel() {
  var panel = document.getElementById('setlistPanel');
  if (!panel || fullSetlist.length === 0) return;
  var items = '';
  for (var i = 0; i < fullSetlist.length; i++) {
    var item = fullSetlist[i];
    var classes = 'setlist-item';
    if (item.isDivider) classes += ' divider';
    if (i === currentSceneIndex) classes += ' active';
    var clickAttr = item.isDivider ? '' : ' onclick="gotoScene(' + i + ')"';
    var displayName = item.name.replace(/^\*/, '');
    items += '<div class="' + classes + '"' + clickAttr + '>' + displayName + '</div>';
  }
  panel.innerHTML = items;
  // Scroll active item into view
  var active = panel.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function gotoScene(index) {
  wsSend({ type: 'command', action: 'goto', index: index });
}

// --- Hook: populate setlist panel from server state ---
var _origUpdateDisplay = typeof updateDisplay === 'function' ? updateDisplay : null;
var _hookUpdateDisplay = function(data) {
  if (data && data.setList) {
    fullSetlist = [];
    for (var i = 0; i < data.setList.length; i++) {
      var item = data.setList[i];
      if (typeof item === 'object' && item.type === 'divider') {
        fullSetlist.push({ name: item.name, isDivider: true });
      } else {
        // Strip path/extension for display
        var name = String(item).replace(/\.txt$/i, '').replace(/^.*? - /, '');
        fullSetlist.push({ name: name, isDivider: false });
      }
    }
  }
  if (data && typeof data.songPointer === 'number') {
    currentSceneIndex = data.songPointer;
  }
  renderSetlistPanel();
};
